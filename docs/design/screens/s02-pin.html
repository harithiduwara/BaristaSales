{{status}}
<main class="body" style="justify-content:space-between;padding-top:48px">
  <div class="stack" style="align-items:center;text-align:center;gap:8px">
    <div class="badge" style="min-height:28px">Aluthgama Daily Report</div>
    <h2 class="h2" style="margin-top:16px">Enter your PIN</h2>
    <p class="muted" style="font-size:var(--fs-14)">Outlet phone</p>
  </div>
  <div class="stack" style="gap:24px">
    <div class="pin-dots" role="img" aria-label="3 of 6 digits entered"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i></div>
    <p class="hint" style="text-align:center;min-height:20px" aria-live="polite">&nbsp;</p>
    <div class="keypad" aria-label="PIN keypad">
      <button class="key">1</button><button class="key">2</button><button class="key">3</button>
      <button class="key">4</button><button class="key">5</button><button class="key">6</button>
      <button class="key">7</button><button class="key">8</button><button class="key">9</button>
      <span class="key ghost" aria-hidden="true"></span><button class="key">0</button><button class="key ghost" aria-label="Delete last digit">{{i:backspace}}</button>
    </div>
  </div>
  <p class="hint" style="text-align:center">Version 1.0.0</p>
</main>
<div class="gesture"></div>
